; CRF250L Fan Controller — DIY ESP32, failsafe-first (parallels OEM thermoswitch)
;
; Three environments:
;   esp32dev  — plain ESP32 WROOM-32, the bench/experiment board
;   esp32-s3  — eventual bike-computer platform (more flash/PSRAM/USB)
;   native    — HOST build for `pio test -e native`; runs the pure lib/ logic
;               with no hardware. This is where failsafe logic gets tested.

[platformio]
default_envs = esp32dev

; ---- shared Arduino config for the two ESP32 targets ----
[esp32_base]
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.5
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit SSD1306@^2.5.15
    adafruit/Adafruit GFX Library@^1.12.4

[env:esp32dev]
extends = esp32_base
platform = espressif32
board = esp32dev
build_flags = -D BOARD_ESP32DEV

; bench bring-up: same as esp32dev but with low, hand-triggerable fan thresholds
; (BENCH_MODE). Flash this for Stage 1/2 bench testing; use esp32dev for the bike.
[env:esp32dev_bench]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D BENCH_MODE

[env:esp32-s3]
extends = esp32_base
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -D BOARD_ESP32S3

; ---- host test environment: no Arduino framework, pure C++ ----
[env:native]
platform = native
test_framework = unity
build_flags = -D UNIT_TEST -std=gnu++17
